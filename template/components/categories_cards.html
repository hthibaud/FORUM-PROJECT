{{define "category-card"}}
<div>
    <a href="/category/{{.ID}}" class="card" style="text-decoration: none;">
        <h3>{{.Name}}</h3>
        <p>{{.Desc}}</p>
    </a>
</div>
{{end}}

    </a>
</div>
{{end}}
