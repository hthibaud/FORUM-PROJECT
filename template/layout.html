<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - ZiimForum</title>
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">
    <header>
        <div class="container">
            <nav style="display: flex; justify-content: space-between; align-items: center;">
                <a href="/" style="font-family: var(--font-display); font-size: 1.8rem; font-weight: 700; color: var(--accent-primary); text-decoration: none;">ZiimForum</a>
                <ul>
                    <li><a href="/">Accueil</a></li>
                    <li><a href="/categories">Catégories</a></li>
                    <li>
                        <button id="theme-toggle" class="btn btn-outline" style="padding: 0.4rem; font-size: 1rem; cursor: pointer; border-radius: 50%; width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; margin-left: var(--space-sm);">
                            <span id="theme-icon">⏾</span>
                        </button>
                    </li>
                    <li><a href="/login" class="btn btn-outline" style="padding: 0.4rem 1rem; font-size: 0.9rem;">Connexion</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div style="flex: 1;">
        {{.Body}}
    </div>

    <footer style="background-color: var(--bg-deep); padding: var(--space-md) 0; text-align: center; margin-top: var(--space-lg);">
        <div class="container">
            <p style="margin-bottom: var(--space-sm);">&copy; 2026 ZiimForum. Tous droits réservés.</p>
            <div style="display: flex; justify-content: center; gap: var(--space-md);">
                <a href="/rules">Règles du forum</a>
                <a href="/contact">Nous contacter</a>
            </div>
        </div>
    </footer>
    <script src="/static/js/script.js"></script>
</body>
</html>
