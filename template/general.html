{{define "page"}}
<main class="general-page">
    <div class="container">
        <div class="page-grid">
            <aside class="sidebar">
                <h2>Catégories</h2>
                <div class="sidebar-menu">
                    {{range .Categories}}
                        {{template "category-card" .}}
                    {{end}}
                </div>
            </aside>

            <section class="main-content">
                <div class="panel">
                    <h2>Zone de posts</h2>
                    <p>Ici on pourra faire défiler les posts généraux qui traiteront de pleins de sujets divers.</p>
                </div>
            </section>

            <aside class="sidebar">
                <h2>Notifications</h2>
                <div class="sidebar-menu">
                    <a href="/notifications" class="card">
                        <h3>Récemment</h3>
                        <p>Leo67 a liké votre post.</p>
                    </a>
            </aside>
        </div>
    </div>
</main>
{{end}}
