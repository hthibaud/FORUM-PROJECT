{{define "page"}}
<main class="container" style="padding: 1rem;">
    <section class="error-page">
        <div class="register-card error-card">
            <h1 style="font-size: 2.5rem;">Connexion</h1>
            <p class="text-muted" style="margin-top: -1rem; margin-bottom: 2rem; font-size: 1.1rem;">Connectez-vous pour accéder à votre compte.</p>

            {{if .Message}}
            <div class="alert alert-danger">{{.Message}}</div>
            {{end}}

            <form method="post" action="/login">
                <div class="form-group" style="margin-bottom: 1rem;">
                    <input type="text" id="username" name="username" placeholder="Votre pseudo" required class="form-input">
                </div>

                <div class="form-group" style="margin-bottom: 1rem;">
                    <input type="password" id="password" name="password" placeholder=" **********" required class="form-input">
                </div>

                <button type="submit" class="btn" style="width: 100%; margin-top: var(--space-md);">Se connecter</button>
            </form>

            <p id="toggleMessage" style="margin-top: 1rem; text-align: center; color: var(--text-muted);">
                Pas encore de compte ?
                <a href="/register" style="margin-bottom: 1rem; color: var(--accent-secondary); font-weight: bold;">Inscrivez-vous ici</a>
            </p>
        </div>
    </section>
</main>
{{end}}
